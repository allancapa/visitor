<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - City Councilor Visitor E-Logbook</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <!-- SweetAlert2 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet">
  <!-- Custom CSS -->
  <link href="../css/style.css" rel="stylesheet">
</head>
<body>

  <div class="login-wrapper">
    <div class="login-card">
      <div class="login-brand">
        <i class="bi bi-building"></i>
        <h2>City Councilor Office</h2>
        <p>Visitor E-Logbook System</p>
      </div>

      <form id="loginForm" novalidate>
        <div class="mb-3">
          <label for="username" class="form-label fw-semibold">Username</label>
          <div class="input-group">
            <span class="input-group-text bg-light border-end-0">
              <i class="bi bi-person text-muted"></i>
            </span>
            <input type="text" class="form-control border-start-0" id="username" name="username" placeholder="Enter your username" required autocomplete="username">
          </div>
        </div>

        <div class="mb-4">
          <label for="password" class="form-label fw-semibold">Password</label>
          <div class="input-group">
            <span class="input-group-text bg-light border-end-0">
              <i class="bi bi-lock text-muted"></i>
            </span>
            <input type="password" class="form-control border-start-0" id="password" name="password" placeholder="Enter your password" required autocomplete="current-password">
          </div>
        </div>

        <button type="submit" class="btn btn-primary w-100" id="loginBtn">
          <span id="loginBtnText">Sign In</span>
          <span id="loginSpinner" class="spinner-border spinner-border-sm ms-2 d-none" role="status">
            <span class="visually-hidden">Loading...</span>
          </span>
        </button>
      </form>

      <div class="text-center mt-3">
        <small class="text-muted">Default admin: admin / admin123</small>
      </div>
    </div>
  </div>

  <!-- Bootstrap 5 JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- SweetAlert2 JS -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <!-- Shared JS -->
  <script src="../js/app.js"></script>

  <script>
    // If already logged in, redirect to dashboard
    (function () {
      var user = sessionStorage.getItem('vms_user');
      if (user) {
        window.location.href = 'dashboard.html';
      }
    })();

    document.getElementById('loginForm').addEventListener('submit', async function (e) {
      e.preventDefault();

      var username = document.getElementById('username').value.trim();
      var password = document.getElementById('password').value;
      var btn = document.getElementById('loginBtn');
      var btnText = document.getElementById('loginBtnText');
      var spinner = document.getElementById('loginSpinner');

      if (!username || !password) {
        showWarning('Please enter both username and password.');
        return;
      }

      btn.disabled = true;
      btnText.textContent = 'Signing in...';
      spinner.classList.remove('d-none');

      try {
        var response = await fetch(API_BASE + '/login.php', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: username, password: password })
        });

        var data = await response.json();

        if (data.success) {
          sessionStorage.setItem('vms_user', JSON.stringify(data.user));
          showToast('Welcome back, ' + data.user.fullname + '!', 'success');
          setTimeout(function () {
            window.location.href = 'dashboard.html';
          }, 1000);
        } else {
          showError(data.message || 'Login failed. Please try again.');
        }
      } catch (err) {
        showError('Unable to connect to server. Make sure your PHP server is running.');
      } finally {
        btn.disabled = false;
        btnText.textContent = 'Sign In';
        spinner.classList.add('d-none');
      }
    });
  </script>

</body>
</html>
