<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Visitor Management System</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <!-- Custom CSS -->
  <link href="../css/style.css" rel="stylesheet">
</head>
<body>

  <div class="login-wrapper">
    <div class="login-card">
      <div class="login-brand">
        <i class="bi bi-shield-lock"></i>
        <h2>Visitor Management</h2>
        <p>Sign in to your admin account</p>
      </div>

      <!-- Alert for errors -->
      <div id="loginAlert" class="alert alert-danger d-none" role="alert">
        <i class="bi bi-exclamation-circle me-1"></i>
        <span id="loginAlertText"></span>
      </div>

      <form id="loginForm" novalidate>
        <div class="mb-3">
          <label for="username" class="form-label fw-semibold">Username</label>
          <div class="input-group">
            <span class="input-group-text bg-light border-end-0">
              <i class="bi bi-person text-muted"></i>
            </span>
            <input 
              type="text" 
              class="form-control border-start-0" 
              id="username" 
              name="username" 
              placeholder="Enter your username" 
              required 
              autocomplete="username"
            >
          </div>
        </div>

        <div class="mb-4">
          <label for="password" class="form-label fw-semibold">Password</label>
          <div class="input-group">
            <span class="input-group-text bg-light border-end-0">
              <i class="bi bi-lock text-muted"></i>
            </span>
            <input 
              type="password" 
              class="form-control border-start-0" 
              id="password" 
              name="password" 
              placeholder="Enter your password" 
              required 
              autocomplete="current-password"
            >
          </div>
        </div>

        <button type="submit" class="btn btn-primary w-100" id="loginBtn">
          <span id="loginBtnText">Sign In</span>
          <span id="loginSpinner" class="spinner-border spinner-border-sm ms-2 d-none" role="status">
            <span class="visually-hidden">Loading...</span>
          </span>
        </button>
      </form>

      <div class="text-center mt-3">
        <small class="text-muted">Default: admin / admin123</small>
      </div>
    </div>
  </div>

  <!-- Bootstrap 5 JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Shared JS -->
  <script src="../js/app.js"></script>

  <script>
    // If already logged in, redirect to dashboard
    (function () {
      const user = sessionStorage.getItem('vms_user');
      if (user) {
        window.location.href = 'dashboard.html';
      }
    })();

    // Handle login form submission
    document.getElementById('loginForm').addEventListener('submit', async function (e) {
      e.preventDefault();

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const alertBox = document.getElementById('loginAlert');
      const alertText = document.getElementById('loginAlertText');
      const btn = document.getElementById('loginBtn');
      const btnText = document.getElementById('loginBtnText');
      const spinner = document.getElementById('loginSpinner');

      // Hide previous errors
      alertBox.classList.add('d-none');

      // Basic validation
      if (!username || !password) {
        alertText.textContent = 'Please enter both username and password.';
        alertBox.classList.remove('d-none');
        return;
      }

      // Show loading state
      btn.disabled = true;
      btnText.textContent = 'Signing in...';
      spinner.classList.remove('d-none');

      try {
        const response = await fetch(API_BASE + '/login.php', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password }),
        });

        const data = await response.json();

        if (data.success) {
          // Store user info in session storage
          sessionStorage.setItem('vms_user', JSON.stringify(data.user));
          window.location.href = 'dashboard.html';
        } else {
          alertText.textContent = data.message || 'Login failed. Please try again.';
          alertBox.classList.remove('d-none');
        }
      } catch (err) {
        alertText.textContent = 'Unable to connect to server. Make sure your PHP server is running.';
        alertBox.classList.remove('d-none');
      } finally {
        btn.disabled = false;
        btnText.textContent = 'Sign In';
        spinner.classList.add('d-none');
      }
    });
  </script>

</body>
</html>
