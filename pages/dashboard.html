<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - Visitor Management System</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <!-- Custom CSS -->
  <link href="../css/style.css" rel="stylesheet">
</head>
<body>

  <!-- Sidebar Overlay (mobile) -->
  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <i class="bi bi-shield-check"></i>
      <h4>VMS Admin</h4>
    </div>
    <ul class="sidebar-nav">
      <li>
        <a href="dashboard.html" class="active">
          <i class="bi bi-grid-1x2"></i>
          <span>Dashboard</span>
        </a>
      </li>
      <li>
        <a href="visitors.html">
          <i class="bi bi-people"></i>
          <span>Visitors</span>
        </a>
      </li>
      <li>
        <a href="add-visitor.html">
          <i class="bi bi-person-plus"></i>
          <span>Add Visitor</span>
        </a>
      </li>
    </ul>
    <div class="sidebar-footer">
      <a href="#" id="logoutBtn">
        <i class="bi bi-box-arrow-left"></i>
        <span>Logout</span>
      </a>
    </div>
  </aside>

  <!-- Main Content -->
  <div class="main-content">
    <!-- Top Bar -->
    <div class="top-bar">
      <div class="d-flex align-items-center gap-3">
        <button class="sidebar-toggle" id="sidebarToggle" aria-label="Toggle sidebar">
          <i class="bi bi-list"></i>
        </button>
        <h1 class="page-title">Dashboard</h1>
      </div>
      <div class="user-info">
        <i class="bi bi-person-circle"></i>
        <span id="userName">Admin</span>
      </div>
    </div>

    <!-- Content Area -->
    <div class="content-area">

      <!-- Stats Cards Row -->
      <div class="row g-3 mb-4">
        <div class="col-sm-6 col-xl-3">
          <div class="stat-card">
            <div class="d-flex align-items-center justify-content-between mb-3">
              <div class="stat-icon bg-primary-light">
                <i class="bi bi-people"></i>
              </div>
            </div>
            <div class="stat-value" id="statTotal">0</div>
            <div class="stat-label">Total Visitors</div>
          </div>
        </div>
        <div class="col-sm-6 col-xl-3">
          <div class="stat-card">
            <div class="d-flex align-items-center justify-content-between mb-3">
              <div class="stat-icon bg-success-light">
                <i class="bi bi-person-check"></i>
              </div>
            </div>
            <div class="stat-value" id="statCheckedIn">0</div>
            <div class="stat-label">Checked In Today</div>
          </div>
        </div>
        <div class="col-sm-6 col-xl-3">
          <div class="stat-card">
            <div class="d-flex align-items-center justify-content-between mb-3">
              <div class="stat-icon bg-warning-light">
                <i class="bi bi-person-dash"></i>
              </div>
            </div>
            <div class="stat-value" id="statCheckedOut">0</div>
            <div class="stat-label">Checked Out Today</div>
          </div>
        </div>
        <div class="col-sm-6 col-xl-3">
          <div class="stat-card">
            <div class="d-flex align-items-center justify-content-between mb-3">
              <div class="stat-icon bg-danger-light">
                <i class="bi bi-building"></i>
              </div>
            </div>
            <div class="stat-value" id="statCurrentlyIn">0</div>
            <div class="stat-label">Currently In Building</div>
          </div>
        </div>
      </div>

      <!-- Recent Visitors Table -->
      <div class="table-card">
        <div class="table-header">
          <h5><i class="bi bi-clock-history me-2"></i>Recent Visitors</h5>
          <a href="visitors.html" class="btn btn-sm btn-outline-primary">
            View All <i class="bi bi-arrow-right ms-1"></i>
          </a>
        </div>
        <div class="table-responsive">
          <table class="table">
            <thead>
              <tr>
                <th>Name</th>
                <th>Purpose</th>
                <th>Person to Visit</th>
                <th>Check In</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody id="recentVisitorsBody">
              <tr>
                <td colspan="5">
                  <div class="empty-state">
                    <i class="bi bi-inbox d-block"></i>
                    <h6>No visitors yet</h6>
                    <p>Visitors will appear here once they are added.</p>
                  </div>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

    </div>
  </div>

  <!-- Bootstrap 5 JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Shared JS -->
  <script src="../js/app.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      displayUserInfo();
      loadDashboard();
    });

    async function loadDashboard() {
      try {
        const data = await apiFetch('/dashboard-stats.php');

        if (data.success) {
          // Update stat cards
          document.getElementById('statTotal').textContent = data.stats.total_visitors;
          document.getElementById('statCheckedIn').textContent = data.stats.checked_in_today;
          document.getElementById('statCheckedOut').textContent = data.stats.checked_out_today;
          document.getElementById('statCurrentlyIn').textContent = data.stats.currently_in;

          // Update recent visitors table
          renderRecentVisitors(data.recent_visitors);
        }
      } catch (err) {
        // If API is not available, show demo data for preview
        document.getElementById('statTotal').textContent = '--';
        document.getElementById('statCheckedIn').textContent = '--';
        document.getElementById('statCheckedOut').textContent = '--';
        document.getElementById('statCurrentlyIn').textContent = '--';
      }
    }

    function renderRecentVisitors(visitors) {
      const tbody = document.getElementById('recentVisitorsBody');

      if (!visitors || visitors.length === 0) {
        tbody.innerHTML = `
          <tr>
            <td colspan="5">
              <div class="empty-state">
                <i class="bi bi-inbox d-block"></i>
                <h6>No visitors yet</h6>
                <p>Visitors will appear here once they are added.</p>
              </div>
            </td>
          </tr>
        `;
        return;
      }

      tbody.innerHTML = visitors.map(function (v) {
        var statusBadge = v.status === 'checked_in'
          ? '<span class="badge-checked-in">Checked In</span>'
          : '<span class="badge-checked-out">Checked Out</span>';

        return '<tr>' +
          '<td><strong>' + escapeHtml(v.name) + '</strong></td>' +
          '<td>' + escapeHtml(v.purpose) + '</td>' +
          '<td>' + escapeHtml(v.person_to_visit) + '</td>' +
          '<td>' + formatDateTime(v.check_in) + '</td>' +
          '<td>' + statusBadge + '</td>' +
        '</tr>';
      }).join('');
    }

    function escapeHtml(text) {
      if (!text) return '';
      var div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }
  </script>

</body>
</html>
